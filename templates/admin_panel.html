<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: 'Poppins', sans-serif;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        h2 {
            color: #2c3e50;
            font-weight: 600;
        }
        .form-control {
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .btn-primary {
            background: #1abc9c;
            border: none;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background: #16a085;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Admin Panel - Upload Job</h2>
        <form id="jobForm">
            <div class="mb-3">
                <label for="jobTitle" class="form-label">Job Title</label>
                <input type="text" class="form-control" id="jobTitle" name="title" required>
            </div>
            <div class="mb-3">
                <label for="jobDescription" class="form-label">Job Description</label>
                <textarea class="form-control" id="jobDescription" name="description" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Upload Job</button>
        </form>
    </div>

    <script>
        document.getElementById("jobForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const title = document.getElementById("jobTitle").value.trim();
            const description = document.getElementById("jobDescription").value.trim();
            
            if (!title || !description) {
                alert("Please fill in both fields.");
                return;
            }

            try {
                const response = await fetch("/upload_job", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, description })
                });

                const result = await response.json();
                alert(result.message || result.error);

                if (response.ok) {
                    document.getElementById("jobForm").reset();
                }
            } catch (error) {
                alert("An error occurred while uploading the job.");
                console.error("Error:", error);
            }
        });
    </script>
</body>
</html>
