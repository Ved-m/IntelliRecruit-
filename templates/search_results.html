<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobMatch AI - Search Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --success-color: #4cc9f0;
            --warning-color: #ffc107;
            --danger-color: #e63946;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --border-radius: 10px;
            --box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }
        
        body {
            background-color: #f5f7ff;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: var(--dark-color);
            min-height: 100vh;
        }
        
        .sidebar {
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            color: white;
            height: 100vh;
            position: fixed;
            width: 280px;
            box-shadow: var(--box-shadow);
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-brand {
            font-size: 1.8rem;
            font-weight: 700;
        }
        
        .sidebar-nav {
            padding: 20px 0;
        }
        
        .sidebar-nav-item {
            padding: 12px 25px;
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
            text-decoration: none;
        }
        
        .sidebar-nav-item:hover, .sidebar-nav-item.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border-left: 4px solid white;
        }
        
        .sidebar-nav-item i {
            margin-right: 15px;
            width: 20px;
            text-align: center;
        }
        
        .main-content {
            margin-left: 280px;
            padding: 30px;
            transition: all 0.3s ease;
        }
        
        .page-title {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            display: inline-block;
        }
        
        .card {
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card-header {
            background-color: white;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-weight: 600;
            padding: 20px 25px;
            border-radius: var(--border-radius) var(--border-radius) 0 0 !important;
        }
        
        .card-body {
            padding: 25px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 7px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
        
        .table {
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .table thead {
            background: var(--primary-color);
            color: white;
        }
        
        .table tbody tr:hover {
            background: #f1f1f1;
        }
        
        .badge-match {
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.85rem;
        }
        
        .match-excellent {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }
        
        .match-good {
            background-color: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }
        
        .match-average {
            background-color: rgba(249, 115, 22, 0.1);
            color: #f97316;
        }
        
        .match-poor {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }
        
        .generate-review {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 6px 12px;
            transition: all 0.3s ease;
        }
        
        .generate-review:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .review-text {
            margin-top: 10px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: 0.9rem;
            border-left: 4px solid var(--primary-color);
        }
        
        .search-query-display {
            font-style: italic;
            color: var(--secondary-color);
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .no-results i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ccc;
        }
        
        /* Responsive */
        @media (max-width: 992px) {
            .sidebar {
                width: 80px;
                transform: translateX(0);
            }
            
            .sidebar-brand {
                display: none;
            }
            
            .sidebar-nav-item span {
                display: none;
            }
            
            .sidebar-nav-item {
                padding: 15px;
                justify-content: center;
            }
            
            .sidebar-nav-item i {
                margin-right: 0;
                font-size: 1.2rem;
            }
            
            .main-content {
                margin-left: 80px;
            }
        }
        
        @media (max-width: 576px) {
            .sidebar {
                width: 0;
                transform: translateX(-100%);
            }
            
            .main-content {
                margin-left: 0;
                padding: 20px 15px;
            }
            
            .menu-toggle {
                display: block;
            }
        }
        
        .menu-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1060;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--box-shadow);
        }
    </style>
</head>
<body>
    <!-- Menu Toggle Button (Mobile) -->
    <button class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">JobMatch AI</div>
        </div>
        
        <div class="sidebar-nav">
            <a href="{{ url_for('admin_dashboard') }}" class="sidebar-nav-item">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="{{ url_for('admin') }}" class="sidebar-nav-item">
                <i class="fas fa-plus-circle"></i>
                <span>Post Job</span>
            </a>
            <a href="#" class="sidebar-nav-item">
                <i class="fas fa-users"></i>
                <span>Applicants</span>
            </a>
            <a href="#" class="sidebar-nav-item">
                <i class="fas fa-briefcase"></i>
                <span>Job Listings</span>
            </a>
            <a href="#" class="sidebar-nav-item">
                <i class="fas fa-file-alt"></i>
                <span>Reports</span>
            </a>
            <a href="#" class="sidebar-nav-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
            <a href="{{ url_for('home') }}" class="sidebar-nav-item">
                <i class="fas fa-home"></i>
                <span>User View</span>
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="page-title mb-0">Search Results</h1>
            <div class="d-flex">
                <button class="btn btn-outline-primary me-2" id="backButton">
                    <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
                </button>
                <button class="btn btn-primary" id="exportButton">
                    <i class="fas fa-download me-2"></i> Export Results
                </button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-0">Results for: <span class="search-query-display" id="searchQueryDisplay"></span></h5>
                    <small class="text-muted" id="resultCount"></small>
                </div>
                <div class="input-group" style="width: 400px;">
                    <input type="text" class="form-control" id="newSearchInput" placeholder="New search query">
                    <button class="btn btn-outline-primary" type="button" id="newSearchButton">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>
            </div>
            <div class="card-body table-responsive">
                <div id="resultsContainer">
                    <table class="table table-bordered" id="resultsTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Score</th>
                                <th>Job Title</th>
                                <th>Review</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTableBody">
                            <!-- Results will be populated here via JavaScript -->
                        </tbody>
                    </table>
                    
                    <!-- No results message (hidden by default) -->
                    <div class="no-results" id="noResultsMessage" style="display: none;">
                        <i class="fas fa-search"></i>
                        <h4>No results found</h4>
                        <p>Try adjusting your search query</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Toggle sidebar on mobile
        document.getElementById("menuToggle").addEventListener("click", function() {
            const sidebar = document.getElementById("sidebar");
            const mainContent = document.querySelector(".main-content");
            
            if (sidebar.style.transform === "translateX(0px)") {
                sidebar.style.transform = "translateX(-100%)";
                mainContent.style.marginLeft = "0";
            } else {
                sidebar.style.transform = "translateX(0px)";
                sidebar.style.width = "280px";
                mainContent.style.marginLeft = "280px";
            }
        });
        
        // Check screen size on load
        function checkScreenSize() {
            const menuToggle = document.getElementById("menuToggle");
            if (window.innerWidth <= 576) {
                menuToggle.style.display = "flex";
            } else {
                menuToggle.style.display = "none";
            }
        }
        
        window.addEventListener("resize", checkScreenSize);
        document.addEventListener("DOMContentLoaded", checkScreenSize);
        
        // Back button
        document.getElementById('backButton').addEventListener('click', function() {
            window.location.href = '/admin_dashboard';
        });
        
        // Export results
        document.getElementById('exportButton').addEventListener('click', function() {
            const results = JSON.parse(sessionStorage.getItem('searchResults') || '[]');
            if (results.length === 0) {
                alert('No results to export');
                return;
            }
            
            // Prepare CSV content
            let csvContent = "data:text/csv;charset=utf-8,";
            
            // Add headers
            const headers = ["Name", "Email", "Score", "Job Title"];
            csvContent += headers.join(",") + "\r\n";
            
            // Add rows
            results.forEach(function(row) {
                const rowArray = [
                    `"${row.name}"`,
                    `"${row.email}"`,
                    `${row.score}`,
                    `"${row.title}"`
                ];
                csvContent += rowArray.join(",") + "\r\n";
            });
            
            // Create download link
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "search_results.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
        
        // Load search results
// Updated JavaScript for loading search results
function loadSearchResults() {
    const results = JSON.parse(sessionStorage.getItem('searchResults') || '[]');
    const searchQuery = sessionStorage.getItem('searchQuery') || 'No query';
    
    // Display search query
    document.getElementById('searchQueryDisplay').textContent = searchQuery;
    document.getElementById('newSearchInput').value = searchQuery;
    
    // Display result count
    document.getElementById('resultCount').textContent = `${results.length} result${results.length !== 1 ? 's' : ''} found`;
    
    // Populate table or show no results message
    if (results.length > 0) {
        let tableContent = "";
        
        results.forEach(user => {
            // Check if score exists and is a number
            let score = user.score;
            if (score === null || score === undefined) {
                score = 0; // Default to 0 if missing
            }
            
            // Format score with percentage
            const scoreDisplay = typeof score === 'number' ? `${score.toFixed(2)}%` : `${score}%`;
            
            // Determine match score badge class
            let matchBadgeClass = "";
            if (score >= 85) {
                matchBadgeClass = "match-excellent";
            } else if (score >= 70) {
                matchBadgeClass = "match-good";
            } else if (score >= 50) {
                matchBadgeClass = "match-average";
            } else {
                matchBadgeClass = "match-poor";
            }
            
            tableContent += `
                <tr>
                    <td><strong>${user.name || 'N/A'}</strong></td>
                    <td>${user.email || 'N/A'}</td>
                    <td><span class="badge-match ${matchBadgeClass}">${scoreDisplay}</span></td>
                    <td>${user.title || 'N/A'}</td>
                    <td>
                        <button class="btn btn-sm generate-review" data-email="${user.email}">
                            <i class="fas fa-clipboard-check me-1"></i> Generate
                        </button>
                        <div class="review-text" style="display: none;"></div>
                    </td>
                </tr>
            `;
        });
        
        document.getElementById('resultsTableBody').innerHTML = tableContent;
        document.getElementById('resultsTable').style.display = 'table';
        document.getElementById('noResultsMessage').style.display = 'none';
    } else {
        document.getElementById('resultsTable').style.display = 'none';
        document.getElementById('noResultsMessage').style.display = 'block';
    }
}

// Updated search functionality
document.getElementById('newSearchButton').addEventListener('click', function() {
    const searchQuery = document.getElementById('newSearchInput').value.trim();
    
    if (!searchQuery) {
        alert('Please enter a search query');
        return;
    }
    
    // Show loading state
    this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';
    this.disabled = true;
    
    // Send the search query to the backend
    fetch('/search_applicants', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ query: searchQuery }),
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(errorData => {
                throw new Error(errorData.error || 'Network response was not ok');
            });
        }
        return response.json();
    })
    .then(data => {
        console.log("Search results:", data);
        // Update sessionStorage
        sessionStorage.setItem('searchResults', JSON.stringify(data));
        sessionStorage.setItem('searchQuery', searchQuery);
        
        // Reload results
        loadSearchResults();
        
        // Reset button
        this.innerHTML = '<i class="fas fa-search"></i> Search';
        this.disabled = false;
    })
    .catch(error => {
        console.error('Error searching applicants:', error);
        alert(`Error searching applicants: ${error.message}`);
        
        // Reset button
        this.innerHTML = '<i class="fas fa-search"></i> Search';
        this.disabled = false;
    });
});
        // Allow Enter key to trigger new search
        document.getElementById('newSearchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('newSearchButton').click();
            }
        });
        
        // Handle review generation
        document.addEventListener("click", function (event) {
            if (event.target.classList.contains("generate-review") || event.target.parentElement.classList.contains("generate-review")) {
                const button = event.target.classList.contains("generate-review") ? event.target : event.target.parentElement;
                const email = button.getAttribute("data-email");
                const reviewTextDiv = button.nextElementSibling;
                
                // If review is already generated, toggle visibility
                if (reviewTextDiv.textContent) {
                    reviewTextDiv.style.display = reviewTextDiv.style.display === 'none' ? 'block' : 'none';
                    return;
                }
                
                // Change button text to loading state
                const originalButtonHTML = button.innerHTML;
                button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
                button.disabled = true;

                // Send email to the backend
                fetch("/generate_review", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ email: email }),
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Network response was not ok");
                    }
                    return response.json();
                })
                .then(data => {
                    // Display the generated suggestions
                    reviewTextDiv.textContent = data.suggestions;
                    reviewTextDiv.style.display = "block";
                    
                    // Reset button
                    button.innerHTML = '<i class="fas fa-check me-1"></i> View';
                })
                .catch(error => {
                    console.error("Error generating suggestions:", error);
                    alert("Error generating suggestions. Please try again.");
                    
                    // Reset button to original state
                    button.innerHTML = originalButtonHTML;
                    button.disabled = false;
                });
            }
        });
        
        // Load results on page load
        document.addEventListener("DOMContentLoaded", loadSearchResults);
    </script>
</body>
</html>
