<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Job Recommendation System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        
        .navbar {
            background: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .navbar h1 {
            font-size: 24px;
        }
        
        .navbar button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .navbar button:hover {
            background: #c0392b;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 12px 20px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .tab-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .job-section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .job-header {
            border-left: 4px solid #667eea;
            padding-left: 15px;
            margin-bottom: 20px;
        }
        
        .job-header h3 {
            color: #2c3e50;
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .job-stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stat-value {
            font-weight: bold;
            font-size: 18px;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 12px;
        }
        
        .applicant-card {
            background: #f9f9f9;
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            border-left: 4px solid #27ae60;
        }
        
        .applicant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .applicant-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
        }
        
        .score-badge {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        
        .applicant-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .info-item {
            color: #555;
        }
        
        .info-item strong {
            color: #2c3e50;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-pending {
            background: #f39c12;
            color: white;
        }
        
        .status-reviewed {
            background: #3498db;
            color: white;
        }
        
        .status-accepted {
            background: #27ae60;
            color: white;
        }
        
        .status-rejected {
            background: #e74c3c;
            color: white;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-review {
            background: #3498db;
            color: white;
        }
        
        .btn-accept {
            background: #27ae60;
            color: white;
        }
        
        .btn-reject {
            background: #e74c3c;
            color: white;
        }
        
        .btn-ai-review {
            background: #9b59b6;
            color: white;
        }
        
        .action-btn:hover {
            opacity: 0.8;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow: auto;
        }
        
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 25px;
            border: 1px solid #888;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close-btn:hover {
            color: black;
        }
        
        .modal-title {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .error {
            color: #e74c3c;
            font-size: 14px;
            margin: 10px 0;
        }
        
        .success {
            color: #27ae60;
            font-size: 14px;
            margin: 10px 0;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            padding: 20px;
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }
        
        .post-job-form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .submit-btn {
            background: #27ae60;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        
        .submit-btn:hover {
            background: #229954;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>👨‍💼 Admin Dashboard</h1>
        <div>
            <span id="adminName"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </div>
    
    <div class="container">
        <!-- Post Job Section -->
        <div class="section">
            <h2 class="section-title">📝 Post New Job</h2>
            <div class="post-job-form">
                <form id="postJobForm" onsubmit="postJob(event)">
                    <div class="form-group">
                        <label for="jobTitle">Job Title</label>
                        <input type="text" id="jobTitle" required placeholder="e.g., Senior Software Engineer">
                    </div>
                    
                    <div class="form-group">
                        <label for="jobDescription">Job Description</label>
                        <textarea id="jobDescription" rows="6" required placeholder="Describe the job, requirements, responsibilities..."></textarea>
                    </div>
                    
                    <div id="postJobError" class="error"></div>
                    <div id="postJobSuccess" class="success"></div>
                    
                    <button type="submit" class="submit-btn">Post Job</button>
                </form>
            </div>
        </div>
        
        <!-- View Applicants Section -->
        <div class="section">
            <h2 class="section-title">👥 View Applicants by Job</h2>
            <div id="jobsList" class="loading">Loading jobs...</div>
        </div>
    </div>
    
    <!-- Review Application Modal -->
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('reviewModal')">&times;</span>
            <h2 class="modal-title">Review Application</h2>
            
            <div id="applicantInfo"></div>
            
            <form id="reviewForm">
                <div class="form-group">
                    <label for="reviewStatus">Status</label>
                    <select id="reviewStatus" required>
                        <option value="pending">Pending</option>
                        <option value="reviewed">Reviewed</option>
                        <option value="accepted">Accepted</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="reviewText">Review Notes</label>
                    <textarea id="reviewText" rows="5" placeholder="Enter your review and feedback..."></textarea>
                </div>
                
                <div id="reviewError" class="error"></div>
                <div id="reviewSuccess" class="success"></div>
                
                <button type="submit" class="submit-btn">Save Review</button>
            </form>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <!-- Firebase SDK - Compat Version -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBn2zS0oGvllRibOYAHhV5FlI3GbsG8ZX0",
            authDomain: "job-recommendation-syste-fc2b0.firebaseapp.com",
            projectId: "job-recommendation-syste-fc2b0",
            storageBucket: "job-recommendation-syste-fc2b0.firebasestorage.app",
            messagingSenderId: "1084464227558",
            appId: "1:1084464227558:web:8249b24c446320ed738727"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        let currentReviewAppId = null;
        
        // Check authentication
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '/auth';
                return;
            }
            
            const userData = localStorage.getItem('user');
            if (!userData) {
                window.location.href = '/auth';
                return;
            }
            
            const userObj = JSON.parse(userData);
            if (userObj.role !== 'admin') {
                window.location.href = '/user_dashboard';
                return;
            }
            
            document.getElementById('adminName').textContent = `${userObj.name} (Admin)`;
            loadAllJobs();
        });
        
        // Get ID Token
        function getIdToken() {
            return localStorage.getItem('idToken');
        }
        
        // API Call with Auth
        async function apiCall(endpoint, method = 'GET', body = null) {
            const token = getIdToken();
            
            const options = {
                method,
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            };
            
            if (body) options.body = JSON.stringify(body);
            
            const response = await fetch(endpoint, options);
            
            if (response.status === 401) {
                logout();
            }
            
            return response.json();
        }
        
        // Post new job
        async function postJob(event) {
            event.preventDefault();
            
            const title = document.getElementById('jobTitle').value;
            const description = document.getElementById('jobDescription').value;
            
            try {
                const result = await apiCall('/api/admin/jobs', 'POST', {
                    title,
                    description
                });
                
                if (result.error) {
                    throw new Error(result.error);
                }
                
                document.getElementById('postJobSuccess').textContent = '✅ Job posted successfully!';
                document.getElementById('postJobForm').reset();
                
                setTimeout(() => {
                    document.getElementById('postJobSuccess').textContent = '';
                    loadAllJobs();
                }, 1500);
            } catch (error) {
                document.getElementById('postJobError').textContent = `Error: ${error.message}`;
            }
        }
        
        // Load all jobs with applicant stats (job-wise)
        async function loadAllJobs() {
            try {
                const jobs = await apiCall('/api/admin/all-applicants');
                const jobsList = document.getElementById('jobsList');
                
                if (jobs.error) {
                    jobsList.innerHTML = `<div class="empty-state">Error loading jobs</div>`;
                    return;
                }
                
                if (!Array.isArray(jobs) || jobs.length === 0) {
                    jobsList.innerHTML = `<div class="empty-state">No jobs posted yet</div>`;
                    return;
                }
                
                jobsList.innerHTML = jobs.map(job => `
                    <div class="job-section">
                        <div class="job-header">
                            <h3>${job.title}</h3>
                            <div class="job-stats">
                                <div class="stat">
                                    <span class="stat-value">${job.total_applicants}</span>
                                    <span class="stat-label">Total Applicants</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-value" style="color: #3498db;">${job.reviewed}</span>
                                    <span class="stat-label">Reviewed</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-value" style="color: #27ae60;">${job.accepted}</span>
                                    <span class="stat-label">Accepted</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-value" style="color: #e74c3c;">${job.rejected}</span>
                                    <span class="stat-label">Rejected</span>
                                </div>
                            </div>
                        </div>
                        <button class="action-btn" style="background: #667eea; color: white; padding: 10px 20px; margin-top: 15px;" onclick="loadJobApplicants(${job.job_id})">
                            View Applicants →
                        </button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading jobs:', error);
                document.getElementById('jobsList').innerHTML = `<div class="error">Failed to load jobs: ${error.message}</div>`;
            }
        }
        
        // Load applicants for a specific job
        async function loadJobApplicants(jobId) {
            try {
                const applicants = await apiCall(`/api/admin/job-applicants/${jobId}?top_k=20`);
                
                if (applicants.error) {
                    alert('Error loading applicants');
                    return;
                }
                
                const jobsList = document.getElementById('jobsList');
                const jobTitle = applicants[0]?.title || 'Job';
                
                let html = `
                    <div style="margin-bottom: 20px;">
                        <button class="action-btn" style="background: #95a5a6; color: white; padding: 10px 20px;" onclick="loadAllJobs()">
                            ← Back to All Jobs
                        </button>
                    </div>
                    <div class="job-section">
                        <div class="job-header">
                            <h3>📋 Top Applicants for: ${jobTitle}</h3>
                        </div>
                `;
                
                if (applicants.length === 0) {
                    html += '<div class="empty-state">No applicants yet</div>';
                } else {
                    html += applicants.map(app => `
                        <div class="applicant-card">
                            <div class="applicant-header">
                                <span class="applicant-name">${app.name}</span>
                                <span class="score-badge">${app.score.toFixed(2)}%</span>
                            </div>
                            <div class="applicant-info">
                                <div class="info-item"><strong>Email:</strong> ${app.email}</div>
                                <div class="info-item"><strong>Status:</strong> <span class="status-badge status-${app.status}">${app.status.toUpperCase()}</span></div>
                                <div class="info-item"><strong>Applied:</strong> ${new Date(app.submitted_at).toLocaleDateString()}</div>
                            </div>
                            ${app.review ? `<div class="info-item"><strong>Review:</strong><br>${app.review.substring(0, 100)}...</div>` : ''}
                            <div class="action-buttons">
                                <button class="action-btn btn-ai-review" onclick="generateAIReview(${app.id})">🤖 Generate AI Review</button>
                                <button class="action-btn btn-review" onclick="openReviewModal(${app.id}, '${app.name}')">✏️ Manual Review</button>
                                <button class="action-btn btn-accept" onclick="quickReview(${app.id}, 'accepted')">✅ Accept</button>
                                <button class="action-btn btn-reject" onclick="quickReview(${app.id}, 'rejected')">❌ Reject</button>
                            </div>
                        </div>
                    `).join('');
                }
                
                html += '</div>';
                jobsList.innerHTML = html;
            } catch (error) {
                console.error('Error loading applicants:', error);
                alert('Failed to load applicants: ' + error.message);
            }
        }
        
        // Generate AI Review
        async function generateAIReview(appId) {
            try {
                const result = await apiCall(`/api/admin/generate-review/${appId}`, 'POST');
                
                if (result.error) {
                    alert('Error: ' + result.error);
                    return;
                }
                
                alert('AI Review Generated:\n\n' + result.review);
                
                // Auto-save the review
                await apiCall(`/api/admin/review-application/${appId}`, 'POST', {
                    status: 'reviewed',
                    review: result.review
                });
                
                // Reload
                const currentJobId = document.querySelector('.job-header h3')?.textContent;
                alert('Review saved and marked as reviewed!');
            } catch (error) {
                alert('Error generating review: ' + error.message);
            }
        }
        
        // Quick review (accept/reject)
        async function quickReview(appId, status) {
            try {
                const result = await apiCall(`/api/admin/review-application/${appId}`, 'POST', {
                    status: status,
                    review: status === 'accepted' ? 'Application accepted.' : 'Application rejected.'
                });
                
                if (result.error) {
                    alert('Error: ' + result.error);
                    return;
                }
                
                alert(`✅ Application ${status}!`);
                location.reload();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        // Open review modal
        function openReviewModal(appId, name) {
            currentReviewAppId = appId;
            document.getElementById('applicantInfo').innerHTML = `<p><strong>Applicant:</strong> ${name}</p>`;
            document.getElementById('reviewStatus').value = 'reviewed';
            document.getElementById('reviewText').value = '';
            document.getElementById('reviewError').textContent = '';
            document.getElementById('reviewSuccess').textContent = '';
            document.getElementById('reviewModal').style.display = 'block';
        }
        
        // Close modal
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        // Submit review
        document.getElementById('reviewForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                const status = document.getElementById('reviewStatus').value;
                const review = document.getElementById('reviewText').value;
                
                const result = await apiCall(`/api/admin/review-application/${currentReviewAppId}`, 'POST', {
                    status,
                    review
                });
                
                if (result.error) {
                    throw new Error(result.error);
                }
                
                document.getElementById('reviewSuccess').textContent = '✅ Review saved!';
                setTimeout(() => {
                    closeModal('reviewModal');
                    location.reload();
                }, 1500);
            } catch (error) {
                document.getElementById('reviewError').textContent = 'Error: ' + error.message;
            }
        });
        
        // Logout
        function logout() {
            console.log('🔵 LOGOUT CLICKED');
            try {
                auth.signOut().then(() => {
                    console.log('✅ Firebase signOut successful');
                    localStorage.removeItem('idToken');
                    localStorage.removeItem('user');
                    console.log('✅ Local storage cleared');
                    window.location.href = '/auth';
                }).catch((error) => {
                    console.error('❌ SignOut error:', error);
                    // Force redirect even if signOut fails
                    localStorage.removeItem('idToken');
                    localStorage.removeItem('user');
                    window.location.href = '/auth';
                });
            } catch (error) {
                console.error('❌ Logout error:', error);
                localStorage.removeItem('idToken');
                localStorage.removeItem('user');
                window.location.href = '/auth';
            }
        }
    </script>
</body>
</html>
